<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Student Result Portal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f0f4f8;
    color: #1a202c;
    min-height: 100vh;
  }

  header {
    background: #1a365d;
    color: white;
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 20px; font-weight: 600; }
  header span { font-size: 13px; opacity: 0.7; }

  .tabs {
    display: flex;
    gap: 0;
    background: #2d4a7a;
    padding: 0 32px;
  }
  .tab {
    padding: 12px 24px;
    cursor: pointer;
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
  }
  .tab.active {
    color: white;
    border-bottom-color: #63b3ed;
    background: rgba(255,255,255,0.05);
  }

  .page { display: none; padding: 32px; max-width: 1000px; margin: 0 auto; }
  .page.active { display: block; }

  .card {
    background: white;
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  .card h2 {
    font-size: 16px;
    font-weight: 600;
    color: #2d3748;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid #e2e8f0;
  }

  label { font-size: 13px; color: #4a5568; display: block; margin-bottom: 4px; margin-top: 12px; }

  input, select {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid #cbd5e0;
    border-radius: 6px;
    font-size: 14px;
    background: #f7fafc;
    transition: border 0.2s;
  }
  input:focus, select:focus { outline: none; border-color: #4299e1; background: white; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  button {
    padding: 10px 22px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.2s;
  }
  .btn-primary { background: #1a365d; color: white; margin-top: 16px; }
  .btn-primary:hover { background: #2a4a7f; }
  .btn-danger { background: #e53e3e; color: white; padding: 6px 12px; font-size: 12px; }
  .btn-success { background: #276749; color: white; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    background: #edf2f7;
    text-align: left;
    padding: 10px 14px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #718096;
  }
  td { padding: 10px 14px; border-bottom: 1px solid #f0f0f0; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f7fafc; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge-pass { background: #c6f6d5; color: #276749; }
  .badge-fail { background: #fed7d7; color: #9b2c2c; }
  .badge-a { background: #bee3f8; color: #2b6cb0; }
  .badge-b { background: #e9d8fd; color: #553c9a; }
  .badge-c { background: #fefcbf; color: #744210; }

  .result-card {
    background: linear-gradient(135deg, #1a365d, #2d4a7a);
    color: white;
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 20px;
  }
  .result-card .student-name { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .result-card .meta { font-size: 13px; opacity: 0.75; margin-bottom: 20px; }
  .result-card .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .stat-box { background: rgba(255,255,255,0.12); border-radius: 8px; padding: 12px; text-align: center; }
  .stat-box .val { font-size: 24px; font-weight: 700; }
  .stat-box .lbl { font-size: 11px; opacity: 0.7; margin-top: 2px; }

  .empty-state { text-align: center; padding: 40px; color: #a0aec0; }
  .empty-state .icon { font-size: 40px; margin-bottom: 8px; }

  .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
  .search-bar input { flex: 1; margin: 0; }

  .subject-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 8px; }
  .subject-row .sub-name { font-size: 14px; color: #2d3748; padding-top: 10px; }

  .alert { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-top: 12px; }
  .alert-success { background: #c6f6d5; color: #276749; }
  .alert-error { background: #fed7d7; color: #9b2c2c; }
</style>
</head>
<body>

<header>
  <h1>🎓 Student Result Portal</h1>
  <span>Academic Management System</span>
</header>

<div class="tabs">
  <div class="tab active" onclick="showPage('admin')">Admin Panel</div>
  <div class="tab" onclick="showPage('view')">View Results</div>
  <div class="tab" onclick="showPage('report')">Report Card</div>
</div>

<!-- ADMIN PAGE -->
<div class="page active" id="page-admin">

  <div class="card">
    <h2>Add Student Result</h2>
    <div class="grid2">
      <div>
        <label>Student Name</label>
        <input type="text" id="studentName" placeholder="e.g. Rahul Sharma" />
      </div>
      <div>
        <label>Roll Number</label>
        <input type="text" id="rollNo" placeholder="e.g. 2024001" />
      </div>
      <div>
        <label>Class / Section</label>
        <input type="text" id="className" placeholder="e.g. 10-A" />
      </div>
      <div>
        <label>Academic Year</label>
        <input type="text" id="year" placeholder="e.g. 2024-25" />
      </div>
    </div>

    <div style="margin-top:16px;">
      <label style="font-size:14px; font-weight:600; color:#2d3748;">Subject Marks (out of 100)</label>
      <div id="subjectRows" style="margin-top:10px;">
        <!-- filled by JS -->
      </div>
    </div>

    <div id="addMsg"></div>
    <button class="btn-primary" onclick="addResult()">➕ Add Result</button>
  </div>

  <div class="card">
    <h2>All Students</h2>
    <div id="adminTable">
      <div class="empty-state"><div class="icon">📋</div><p>No results added yet.</p></div>
    </div>
  </div>

</div>

<!-- VIEW PAGE -->
<div class="page" id="page-view">
  <div class="card">
    <h2>Search Student Result</h2>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search by name or roll number..." oninput="searchResults()" />
    </div>
    <div id="searchResults">
      <div class="empty-state"><div class="icon">🔍</div><p>Enter a name or roll number to search.</p></div>
    </div>
  </div>
</div>

<!-- REPORT CARD PAGE -->
<div class="page" id="page-report">
  <div class="card">
    <h2>Generate Report Card</h2>
    <label>Select Student</label>
    <select id="reportSelect" onchange="showReportCard()">
      <option value="">-- Select a student --</option>
    </select>
  </div>
  <div id="reportCardArea"></div>
</div>

<script>
const SUBJECTS = ['Mathematics', 'Science', 'English', 'Social Studies', 'Hindi'];
let students = JSON.parse(localStorage.getItem('students') || '[]');

function init() {
  renderSubjectRows();
  renderAdminTable();
  populateReportSelect();
}

function renderSubjectRows() {
  const container = document.getElementById('subjectRows');
  container.innerHTML = SUBJECTS.map((s, i) => `
    <div class="subject-row">
      <div class="sub-name">${s}</div>
      <div><label>Theory</label><input type="number" id="th_${i}" min="0" max="100" placeholder="0-100"/></div>
      <div><label>Practical</label><input type="number" id="pr_${i}" min="0" max="100" placeholder="0-100"/></div>
      <div><label>Total</label><input type="number" id="tot_${i}" min="0" max="100" readonly style="background:#edf2f7;color:#718096"/></div>
    </div>
  `).join('');

  SUBJECTS.forEach((_, i) => {
    ['th_', 'pr_'].forEach(prefix => {
      document.getElementById(prefix + i).addEventListener('input', () => calcTotal(i));
    });
  });
}

function calcTotal(i) {
  const th = parseInt(document.getElementById('th_' + i).value) || 0;
  const pr = parseInt(document.getElementById('pr_' + i).value) || 0;
  document.getElementById('tot_' + i).value = Math.min(th + pr, 100);
}

function getGrade(marks) {
  if (marks >= 90) return 'A+';
  if (marks >= 80) return 'A';
  if (marks >= 70) return 'B+';
  if (marks >= 60) return 'B';
  if (marks >= 50) return 'C';
  if (marks >= 40) return 'D';
  return 'F';
}

function getBadgeClass(grade) {
  if (grade.startsWith('A')) return 'badge-a';
  if (grade.startsWith('B')) return 'badge-b';
  if (grade.startsWith('C') || grade === 'D') return 'badge-c';
  return 'badge-fail';
}

function addResult() {
  const name = document.getElementById('studentName').value.trim();
  const roll = document.getElementById('rollNo').value.trim();
  const cls = document.getElementById('className').value.trim();
  const year = document.getElementById('year').value.trim();
  const msg = document.getElementById('addMsg');

  if (!name || !roll || !cls || !year) {
    msg.innerHTML = '<div class="alert alert-error">Please fill all student details.</div>';
    return;
  }

  const subjects = SUBJECTS.map((s, i) => {
    const th = parseInt(document.getElementById('th_' + i).value) || 0;
    const pr = parseInt(document.getElementById('pr_' + i).value) || 0;
    const total = Math.min(th + pr, 100);
    return { name: s, theory: th, practical: pr, total };
  });

  const totalMarks = subjects.reduce((a, b) => a + b.total, 0);
  const maxMarks = SUBJECTS.length * 100;
  const percentage = ((totalMarks / maxMarks) * 100).toFixed(1);
  const passed = subjects.every(s => s.total >= 40);

  const student = {
    id: Date.now(),
    name, roll, class: cls, year,
    subjects, totalMarks, maxMarks, percentage, passed
  };

  students.push(student);
  localStorage.setItem('students', JSON.stringify(students));

  msg.innerHTML = '<div class="alert alert-success">✅ Result added successfully!</div>';
  setTimeout(() => { msg.innerHTML = ''; }, 3000);

  // Reset form
  document.getElementById('studentName').value = '';
  document.getElementById('rollNo').value = '';
  document.getElementById('className').value = '';
  document.getElementById('year').value = '';
  SUBJECTS.forEach((_, i) => {
    document.getElementById('th_' + i).value = '';
    document.getElementById('pr_' + i).value = '';
    document.getElementById('tot_' + i).value = '';
  });

  renderAdminTable();
  populateReportSelect();
}

function deleteStudent(id) {
  if (!confirm('Delete this student result?')) return;
  students = students.filter(s => s.id !== id);
  localStorage.setItem('students', JSON.stringify(students));
  renderAdminTable();
  populateReportSelect();
}

function renderAdminTable() {
  const container = document.getElementById('adminTable');
  if (!students.length) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>No results added yet.</p></div>';
    return;
  }
  container.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Roll No</th><th>Name</th><th>Class</th><th>Year</th>
          <th>Total</th><th>%</th><th>Status</th><th>Action</th>
        </tr>
      </thead>
      <tbody>
        ${students.map(s => `
          <tr>
            <td>${s.roll}</td>
            <td><strong>${s.name}</strong></td>
            <td>${s.class}</td>
            <td>${s.year}</td>
            <td>${s.totalMarks}/${s.maxMarks}</td>
            <td>${s.percentage}%</td>
            <td><span class="badge ${s.passed ? 'badge-pass' : 'badge-fail'}">${s.passed ? 'PASS' : 'FAIL'}</span></td>
            <td><button class="btn-danger" onclick="deleteStudent(${s.id})">Delete</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function searchResults() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const container = document.getElementById('searchResults');

  if (!q) {
    container.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>Enter a name or roll number to search.</p></div>';
    return;
  }

  const found = students.filter(s =>
    s.name.toLowerCase().includes(q) || s.roll.toLowerCase().includes(q)
  );

  if (!found.length) {
    container.innerHTML = '<div class="empty-state"><div class="icon">😕</div><p>No student found.</p></div>';
    return;
  }

  container.innerHTML = found.map(s => `
    <div style="border:1px solid #e2e8f0; border-radius:8px; padding:16px; margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div>
          <strong style="font-size:16px;">${s.name}</strong>
          <span style="margin-left:10px; font-size:13px; color:#718096;">Roll: ${s.roll} | Class: ${s.class} | ${s.year}</span>
        </div>
        <span class="badge ${s.passed ? 'badge-pass' : 'badge-fail'}">${s.passed ? 'PASS' : 'FAIL'}</span>
      </div>
      <table>
        <thead><tr><th>Subject</th><th>Theory</th><th>Practical</th><th>Total</th><th>Grade</th></tr></thead>
        <tbody>
          ${s.subjects.map(sub => `
            <tr>
              <td>${sub.name}</td>
              <td>${sub.theory}</td>
              <td>${sub.practical}</td>
              <td><strong>${sub.total}</strong></td>
              <td><span class="badge ${getBadgeClass(getGrade(sub.total))}">${getGrade(sub.total)}</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div style="margin-top:10px; font-size:14px; color:#4a5568;">
        Total: <strong>${s.totalMarks}/${s.maxMarks}</strong> &nbsp;|&nbsp;
        Percentage: <strong>${s.percentage}%</strong> &nbsp;|&nbsp;
        Grade: <strong>${getGrade(parseFloat(s.percentage))}</strong>
      </div>
    </div>
  `).join('');
}

function populateReportSelect() {
  const sel = document.getElementById('reportSelect');
  const current = sel.value;
  sel.innerHTML = '<option value="">-- Select a student --</option>' +
    students.map(s => `<option value="${s.id}">${s.name} (${s.roll})</option>`).join('');
  if (current) sel.value = current;
}

function showReportCard() {
  const id = parseInt(document.getElementById('reportSelect').value);
  const area = document.getElementById('reportCardArea');

  if (!id) { area.innerHTML = ''; return; }

  const s = students.find(x => x.id === id);
  if (!s) return;

  area.innerHTML = `
    <div class="result-card">
      <div class="student-name">${s.name}</div>
      <div class="meta">Roll No: ${s.roll} &nbsp;|&nbsp; Class: ${s.class} &nbsp;|&nbsp; Academic Year: ${s.year}</div>
      <div class="stats">
        <div class="stat-box"><div class="val">${s.totalMarks}</div><div class="lbl">Total Marks</div></div>
        <div class="stat-box"><div class="val">${s.percentage}%</div><div class="lbl">Percentage</div></div>
        <div class="stat-box"><div class="val">${getGrade(parseFloat(s.percentage))}</div><div class="lbl">Overall Grade</div></div>
        <div class="stat-box"><div class="val">${s.passed ? '✅' : '❌'}</div><div class="lbl">${s.passed ? 'PASSED' : 'FAILED'}</div></div>
      </div>
    </div>

    <div class="card">
      <h2>Subject-wise Performance</h2>
      <table>
        <thead>
          <tr><th>Subject</th><th>Theory</th><th>Practical</th><th>Total / 100</th><th>Grade</th><th>Status</th></tr>
        </thead>
        <tbody>
          ${s.subjects.map(sub => `
            <tr>
              <td><strong>${sub.name}</strong></td>
              <td>${sub.theory}</td>
              <td>${sub.practical}</td>
              <td>
                <div style="display:flex; align-items:center; gap:8px;">
                  <div style="background:#e2e8f0; border-radius:4px; height:8px; width:80px; overflow:hidden;">
                    <div style="background:#3182ce; height:100%; width:${sub.total}%;"></div>
                  </div>
                  <strong>${sub.total}</strong>
                </div>
              </td>
              <td><span class="badge ${getBadgeClass(getGrade(sub.total))}">${getGrade(sub.total)}</span></td>
              <td><span class="badge ${sub.total >= 40 ? 'badge-pass' : 'badge-fail'}">${sub.total >= 40 ? 'Pass' : 'Fail'}</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>

      <div style="margin-top:20px; padding:14px; background:#f7fafc; border-radius:8px; font-size:14px; color:#4a5568;">
        <strong>Grading Scale:</strong> &nbsp;
        A+ (90-100) &nbsp;|&nbsp; A (80-89) &nbsp;|&nbsp; B+ (70-79) &nbsp;|&nbsp;
        B (60-69) &nbsp;|&nbsp; C (50-59) &nbsp;|&nbsp; D (40-49) &nbsp;|&nbsp; F (Below 40)
      </div>
    </div>

    <div style="text-align:center; margin-bottom:32px;">
      <button class="btn-primary btn-success" onclick="window.print()">🖨️ Print Report Card</button>
    </div>
  `;
}

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  event.target.classList.add('active');

  if (name === 'view') searchResults();
  if (name === 'report') { populateReportSelect(); showReportCard(); }
}

init();
</script>
</body>
</html>
